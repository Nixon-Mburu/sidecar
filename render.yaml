services:
  - type: web
    name: sidecar-relay
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn relay.app:app --workers 1 --threads 8 --bind 0.0.0.0:$PORT --timeout 60 --access-logfile -
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: FIREBASE_PROJECT_ID
        value: sidecarpic
      - key: OWNER_UID
        sync: false
      - key: AGENT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://sidecarpic.web.app,https://sidecarpic.firebaseapp.com
